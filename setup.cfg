[nosetests]
verbosity=2
with-coverage=1
cover-package=service
cover-erase=1
cover-min-percentage=95

[coverage:run]
source=service

[coverage:report]
show_missing=True
fail_under=95
exclude_lines=
    pragma: no cover

[flake8]
max-line-length=127
max-complexity=12
exclude=.git,.venv,venv,htmlcov
per-file-ignores=
    */__init__.py:F401,E402

[pylint.MASTER]
ignore=tests

[pylint.MESSAGES CONTROL]
disable=E1101,C0103,R0903,W1203,R0801,R1705

[pylint.FORMAT]
max-line-length=127
