services:
  postgres:
    image: postgres:alpine
    environment:
      POSTGRES_USER: accounts
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: accounts
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U accounts -d accounts']
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - accounts-data:/var/lib/postgresql
  accounts:
    build: .
    image: accounts:latest
    ports: ['8080:8080']
    environment:
      DATABASE_URI: postgresql://accounts:localdev@postgres:5432/accounts
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  accounts-data:
