apiVersion: v1
kind: ServiceAccount
metadata:
  name: accounts-pipeline
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: accounts-pipeline
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: ['']
    resources: [services, configmaps]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [build.openshift.io]
    resources: [buildconfigs, buildconfigs/instantiatebinary, builds, builds/log]
    verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: accounts-pipeline
subjects:
  - kind: ServiceAccount
    name: accounts-pipeline
roleRef:
  kind: Role
  name: accounts-pipeline
  apiGroup: rbac.authorization.k8s.io
