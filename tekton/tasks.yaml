apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: accounts-clone
spec:
  params:
    - {name: repo-url, type: string}
    - {name: branch, type: string, default: main}
    - {name: run-id, type: string}
  workspaces:
    - name: source
  steps:
    - name: clone
      image: alpine/git:2.47.2
      env:
        - {name: REPO_URL, value: $(params.repo-url)}
        - {name: BRANCH, value: $(params.branch)}
        - {name: SOURCE, value: $(workspaces.source.path)}
        - {name: RUN_ID, value: $(params.run-id)}
      script: |
        #!/bin/sh
        set -eu
        # Isolate source across overlapping PipelineRuns sharing the PVC.
        case "$RUN_ID" in ''|*[!a-zA-Z0-9-]*) exit 1 ;; esac
        mkdir -p "$SOURCE/$RUN_ID"
        rm -rf "${SOURCE:?}/$RUN_ID/repo"
        git clone --depth 1 --branch "$BRANCH" -- "$REPO_URL" "$SOURCE/$RUN_ID/repo"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: accounts-lint
spec:
  params:
    - {name: run-id, type: string}
  workspaces:
    - name: source
  steps:
    - name: lint
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)/$(params.run-id)/repo
      env:
        - {name: HOME, value: /tmp}
      script: |
        #!/bin/sh
        set -eu
        python -m venv /tmp/check-venv
        /tmp/check-venv/bin/pip install --no-cache-dir -r requirements.txt
        /tmp/check-venv/bin/flake8 service tests --count --statistics
        /tmp/check-venv/bin/pylint service --fail-under=8
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: accounts-test
spec:
  params:
    - {name: run-id, type: string}
  workspaces:
    - name: source
  sidecars:
    - name: postgres
      image: quay.io/sclorg/postgresql-15-c9s:latest
      env:
        - {name: POSTGRESQL_USER, value: accounts}
        - {name: POSTGRESQL_PASSWORD, value: disposable-test-password}
        - {name: POSTGRESQL_DATABASE, value: testdb}
      readinessProbe:
        exec:
          command: [sh, -c, 'pg_isready -U accounts -d testdb']
        initialDelaySeconds: 5
        periodSeconds: 3
  steps:
    - name: tests
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)/$(params.run-id)/repo
      env:
        - {name: HOME, value: /tmp}
        - name: DATABASE_URI
          value: postgresql://accounts:disposable-test-password@localhost:5432/testdb
      script: |
        #!/bin/sh
        set -eu
        python -m venv /tmp/test-venv
        /tmp/test-venv/bin/pip install --no-cache-dir -r requirements.txt
        /tmp/test-venv/bin/python - <<'PY'
        import os, time, psycopg2
        for attempt in range(60):
            try:
                psycopg2.connect(os.environ['DATABASE_URI']).close()
                break
            except psycopg2.OperationalError:
                if attempt == 59:
                    raise
                time.sleep(1)
        PY
        /tmp/test-venv/bin/nosetests
        /tmp/test-venv/bin/coverage report --fail-under=95
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: accounts-build
spec:
  params:
    - {name: image, type: string}
    - {name: run-id, type: string}
  workspaces:
    - name: source
  steps:
    - name: build-and-push
      image: quay.io/openshift/origin-cli:4.18
      workingDir: $(workspaces.source.path)/$(params.run-id)/repo
      env:
        - {name: IMAGE, value: $(params.image)}
        - {name: BUILD_CONFIG, value: 'accounts-$(context.taskRun.uid)'}
      script: |
        #!/bin/bash
        set -euo pipefail
        [[ "$IMAGE" =~ ^[a-zA-Z0-9._:/@-]+$ ]] || exit 1
        sed -e "s|IMAGE_PLACEHOLDER|$IMAGE|g" \
          -e "s|name: accounts$|name: $BUILD_CONFIG|" deploy/buildconfig.yaml | oc apply -f -
        # OpenShift's build service builds the Dockerfile and pushes to IBM ICR.
        oc start-build "$BUILD_CONFIG" --from-dir=. --follow --wait
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: accounts-deploy
spec:
  params:
    - {name: image, type: string}
    - {name: run-id, type: string}
  workspaces:
    - name: source
  steps:
    - name: deploy
      image: quay.io/openshift/origin-cli:4.18
      workingDir: $(workspaces.source.path)/$(params.run-id)/repo
      env:
        - {name: IMAGE, value: $(params.image)}
      script: |
        #!/bin/bash
        set -euo pipefail
        [[ "$IMAGE" =~ ^[a-zA-Z0-9._:/@-]+$ ]] || exit 1
        oc apply -f deploy/configmap.yaml
        sed "s|IMAGE_PLACEHOLDER|$IMAGE|g" deploy/deployment.yaml | oc apply -f -
        oc rollout restart deployment/accounts
        oc rollout status deployment/accounts --timeout=300s
        oc get deployments,pods,replicasets,services -o wide
