---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: echo
spec:
  description: This task will echo the message.
  params:
    - name: message
      description: The message to echo
      type: string
  steps:
    - name: echo-message
      image: alpine:3
      command: [/bin/echo]
      args: ["$(params.message)"]
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  params:
    - name: run-id
      type: string
  description: This task will clean up a workspace by deleting all of the files.
  workspaces:
    - name: source
  steps:
    - name: remove
      image: alpine:3
      env:
        - name: WORKSPACE_SOURCE_PATH
          value: $(workspaces.source.path)/$(params.run-id)
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env sh
        set -eu
        echo "Removing all files from ${WORKSPACE_SOURCE_PATH} ..."
        # Delete any existing contents of the directory if it exists.
        #
        # We don't just "rm -rf ${WORKSPACE_SOURCE_PATH}" because ${WORKSPACE_SOURCE_PATH} might be "/"
        # or the root of a mounted volume.
        if [ -d "${WORKSPACE_SOURCE_PATH}" ] ; then
          # Delete non-hidden files and directories
          rm -rf "${WORKSPACE_SOURCE_PATH:?}"/*
          # Delete files and directories starting with . but excluding ..
          rm -rf "${WORKSPACE_SOURCE_PATH}"/.[!.]*
          # Delete files and directories starting with .. plus any other character
          rm -rf "${WORKSPACE_SOURCE_PATH}"/..?*
        fi

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: accounts-clone
spec:
  params:
    - name: url
      type: string
    - name: revision
      type: string
      default: main
    - name: run-id
      type: string
  workspaces:
    - name: output
  steps:
    - name: clone
      image: alpine/git:2.47.2
      env:
        - name: REPO_URL
          value: $(params.url)
        - name: BRANCH
          value: $(params.revision)
        - name: SOURCE
          value: $(workspaces.output.path)
        - name: RUN_ID
          value: $(params.run-id)
      script: '#!/bin/sh

        set -eu

        # Isolate source across overlapping PipelineRuns sharing the PVC.

        case "$RUN_ID" in ''''|*[!a-zA-Z0-9-]*) exit 1 ;; esac

        mkdir -p "$SOURCE/$RUN_ID"

        rm -rf "${SOURCE:?}/$RUN_ID/repo"

        git clone --depth 1 --branch "$BRANCH" -- "$REPO_URL" "$SOURCE/$RUN_ID/repo"

        '

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: accounts-lint
spec:
  params:
    - name: run-id
      type: string
  workspaces:
    - name: source
  steps:
    - name: lint
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)/$(params.run-id)/repo
      env:
        - name: HOME
          value: /tmp
      script: '#!/bin/sh

        set -eu

        python -m venv /tmp/check-venv

        /tmp/check-venv/bin/pip install --no-cache-dir -r requirements.txt

        /tmp/check-venv/bin/flake8 service tests --count --statistics

        /tmp/check-venv/bin/pylint service --fail-under=8

        '

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: accounts-test
spec:
  params:
    - name: run-id
      type: string
  workspaces:
    - name: source
  sidecars:
    - name: postgres
      image: quay.io/sclorg/postgresql-15-c9s:latest
      env:
        - name: POSTGRESQL_USER
          value: accounts
        - name: POSTGRESQL_PASSWORD
          value: disposable-test-password
        - name: POSTGRESQL_DATABASE
          value: testdb
      readinessProbe:
        exec:
          command:
            - sh
            - -c
            - pg_isready -U accounts -d testdb
        initialDelaySeconds: 5
        periodSeconds: 3
  steps:
    - name: tests
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)/$(params.run-id)/repo
      env:
        - name: HOME
          value: /tmp
        - name: DATABASE_URI
          value: postgresql://accounts:disposable-test-password@localhost:5432/testdb
      script: "#!/bin/sh\nset -eu\npython -m venv /tmp/test-venv\n/tmp/test-venv/bin/pip install --no-cache-dir -r requirements.txt\n/tmp/test-venv/bin/python - <<'PY'\nimport os, time, psycopg2\nfor attempt in range(60):\n    try:\n        psycopg2.connect(os.environ['DATABASE_URI']).close()\n        break\n    except psycopg2.OperationalError:\n        if attempt == 59:\n            raise\n        time.sleep(1)\nPY\n/tmp/test-venv/bin/nosetests\n/tmp/test-venv/bin/coverage report --fail-under=95\n"

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: accounts-build
spec:
  params:
    - name: image
      type: string
    - name: run-id
      type: string
  workspaces:
    - name: source
  steps:
    - name: build-and-push
      image: quay.io/openshift/origin-cli:4.18
      workingDir: $(workspaces.source.path)/$(params.run-id)/repo
      env:
        - name: IMAGE
          value: $(params.image)
        - name: BUILD_CONFIG
          value: accounts-$(context.taskRun.uid)
      script: "#!/bin/bash\nset -euo pipefail\n[[ \"$IMAGE\" =~ ^[a-zA-Z0-9._:/@-]+$ ]] || exit 1\nsed -e \"s|IMAGE_PLACEHOLDER|$IMAGE|g\" \\\n  -e \"s|name: accounts$|name: $BUILD_CONFIG|\" deploy/buildconfig.yaml | oc apply -f -\n# OpenShift's build service builds the Dockerfile and pushes to IBM ICR.\noc start-build \"$BUILD_CONFIG\" --from-dir=. --follow --wait\n"

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: accounts-deploy
spec:
  params:
    - name: image
      type: string
    - name: run-id
      type: string
  workspaces:
    - name: source
  steps:
    - name: deploy
      image: quay.io/openshift/origin-cli:4.18
      workingDir: $(workspaces.source.path)/$(params.run-id)/repo
      env:
        - name: IMAGE
          value: $(params.image)
      script: '#!/bin/bash

        set -euo pipefail

        [[ "$IMAGE" =~ ^[a-zA-Z0-9._:/@-]+$ ]] || exit 1

        oc apply -f deploy/configmap.yaml

        sed "s|IMAGE_PLACEHOLDER|$IMAGE|g" deploy/deployment.yaml | oc apply -f -

        oc rollout restart deployment/accounts

        oc rollout status deployment/accounts --timeout=300s

        oc get deployments,pods,replicasets,services -o wide

        '
