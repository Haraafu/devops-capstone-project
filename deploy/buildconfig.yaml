apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: accounts
spec:
  runPolicy: Serial
  source:
    type: Binary
    binary: {}
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: DockerImage
      name: IMAGE_PLACEHOLDER
    pushSecret:
      name: ibm-registry
