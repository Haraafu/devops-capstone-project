apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgresql-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: postgresql}
  template:
    metadata:
      labels: {app: postgresql}
    spec:
      containers:
        - name: postgresql
          image: quay.io/sclorg/postgresql-15-c9s:latest
          ports: [{containerPort: 5432}]
          env:
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef: {name: accounts-db, key: username}
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef: {name: accounts-db, key: password}
            - name: POSTGRESQL_DATABASE
              value: accounts
          readinessProbe:
            exec:
              command: [/bin/sh, -c, 'pg_isready -U "$POSTGRESQL_USER" -d "$POSTGRESQL_DATABASE"']
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: postgresql-data}
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
spec:
  selector: {app: postgresql}
  ports: [{port: 5432, targetPort: 5432}]
